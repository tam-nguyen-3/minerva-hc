[project]
name = "minerva-hc"
version = "0.1.0"
description = "LLM agent that answers questions about Minerva HCs by reading the full HC description docs."
readme = "README.md"
authors = [
    { name = "Tam Nguyen", email = "125776168+tam-nguyen-3@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai",
    "python-dotenv",
    "slack-bolt>=1.30.0",
]

[project.scripts]
hc = "minerva_hc.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docs: needs the local HC description docs (not in git)"]
